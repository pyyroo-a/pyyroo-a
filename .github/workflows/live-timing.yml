name: Live Timing

on:
  schedule:
    # Mondays 08:00 UTC, two hours after PitWall's own job adds the race results
    - cron: "0 8 * * 1"
  workflow_dispatch: # run it by hand from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rewrite the live timing section
        run: python scripts/live_timing.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "live timing: update after the latest race"
            git push
          fi
